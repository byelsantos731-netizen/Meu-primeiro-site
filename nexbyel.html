<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexByel | Tecnologia & Inovação Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #0b0b0f;
      color: #ffffff;
      line-height: 1.6;
    }

    /* Cabeçalho Fixo */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(11, 11, 15, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(130, 87, 229, 0.25);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
    }

    .brand span {
      color: #00e699;
    }

    nav {
      display: flex;
      gap: 16px;
    }

    nav a, nav button {
      background: none;
      border: none;
      color: #c4c4cc;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    nav a:hover, nav button:hover {
      color: #00e699;
    }

    /* Seção Principal (Hero) */
    .hero {
      text-align: center;
      padding: 50px 20px 60px;
      background: radial-gradient(circle at top, rgba(130, 87, 229, 0.25) 0%, rgba(11, 11, 15, 1) 70%);
    }

    .logo-destaque {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 0 18px rgba(130, 87, 229, 0.6)) drop-shadow(0 0 18px rgba(0, 230, 153, 0.4));
    }

    .tag-topo {
      display: inline-block;
      background-color: rgba(0, 230, 153, 0.12);
      color: #00e699;
      border: 1px solid rgba(0, 230, 153, 0.3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .texto-gradiente {
      background: linear-gradient(90deg, #996dff, #00e699);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: #a8a8b3;
      max-width: 480px;
      margin: 0 auto 28px;
      font-size: 15px;
    }

    .botoes-hero {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primario {
      background: linear-gradient(90deg, #8257e5, #6833e4);
      color: #ffffff;
      border: none;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(130, 87, 229, 0.4);
    }

    .btn-secundario {
      background-color: #18181f;
      color: #ffffff;
      border: 1px solid #292933;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Seções */
    section {
      padding: 50px 20px;
      max-width: 700px;
      margin: 0 auto;
    }

    .titulo-secao {
      text-align: center;
      margin-bottom: 30px;
    }

    .titulo-secao h2 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .titulo-secao p {
      color: #a8a8b3;
      font-size: 14px;
    }

    .card {
      background-color: #14141a;
      border: 1px solid #24242e;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .card p {
      color: #a8a8b3;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .btn-card {
      display: inline-block;
      background-color: rgba(130, 87, 229, 0.15);
      color: #a883ff;
      border: 1px solid rgba(130, 87, 229, 0.4);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-verde {
      display: inline-block;
      background-color: #00b37e;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    /* Rodapé */
    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid #1e1e26;
      color: #7c7c8a;
      font-size: 13px;
    }

    /* JANELAS INTERNAS (MODAIS) */
    .modal-fundo {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-fundo.ativo {
      display: flex;
    }

    .modal-janela {
      background-color: #16161d;
      border: 1px solid #8257e5;
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
