<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora do Byel</title>
  <style>
    body {
      background-color: #121214;
      color: white;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .calculadora {
      background-color: #202024;
      padding: 20px;
      border-radius: 15px;
      width: 280px;
      border: 2px solid #8257e5;
    }
    #visor {
      width: 100%;
      height: 50px;
      background-color: #121214;
      color: #00b37e;
      font-size: 24px;
      text-align: right;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    .botoes {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background-color: #29292e;
      color: white;
    }
    .operador { background-color: #8257e5; }
    .igual { background-color: #00b37e; grid-column: span 2; }
    .limpar { background-color: #e55757; grid-column: span 2; }
    .voltar {
      display: block;
      text-align: center;
      color: #a8a8b3;
      margin-top: 15px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="calculadora">
    <input type="text" id="visor" disabled placeholder="0">
    
    <div class="botoes">
      <button class="limpar" onclick="limpar()">C</button>
      <button class="operador" onclick="adicionar('/')">÷</button>
      <button class="operador" onclick="adicionar('*')">×</button>

      <button onclick="adicionar('7')">7</button>
      <button onclick="adicionar('8')">8</button>
      <button onclick="adicionar('9')">9</button>
      <button class="operador" onclick="adicionar('-')">-</button>

      <button onclick="adicionar('4')">4</button>
      <button onclick="adicionar('5')">5</button>
      <button onclick="adicionar('6')">6</button>
      <button class="operador" onclick="adicionar('+')">+</button>

      <button onclick="adicionar('1')">1</button>
      <button onclick="adicionar('2')">2</button>
      <button onclick="adicionar('3')">3</button>
      <button onclick="adicionar('.')">.</button>

      <button onclick="adicionar('0')">0</button>
      <button class="igual" onclick="calcular()">=</button>
    </div>

    <a href="index.html" class="voltar">← Voltar para o início</a>
  </div>

  <script>
    let visor = document.getElementById("visor");

    function adicionar(valor) {
      visor.value += valor;
    }

    function limpar() {
      visor.value = "";
    }

    function calcular() {
      try {
        visor.value = eval(visor.value);
      } catch {
        visor.value = "Erro";
      }
    }
  </script>

</body>
</html>
