<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Byel Santos | Fundador NexByel</title>
  
  <!-- Faz a logo aparecer na prévia do Instagram e WhatsApp -->
  <meta property="og:title" content="Byel Santos | NexByel Tecnologia">
  <meta property="og:description" content="Desenvolvimento Web & Soluções Digitais">
  <meta property="og:image" content="https://github.io">

  <style>
    body {
      background: linear-gradient(135deg, #121214 0%, #2e1d59 50%, #8257e5 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .cartao {
      position: relative;
      background-color: rgba(32, 32, 36, 0.94);
      color: #ffffff;
      padding: 42px 24px 32px;
      border-radius: 22px;
      text-align: center;
      max-width: 350px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(130, 87, 229, 0.4);
      transition: all 0.3s ease;
    }
    .cartao.claro {
      background-color: rgba(255, 255, 255, 0.96);
      color: #121214;
    }
    /* Botão das duas luas no canto superior direito */
    .botao-lua {
      position: absolute;
      top: 16px;
      right: 16px;
      background-color: rgba(130, 87, 229, 0.15);
      border: 1px solid rgba(130, 87, 229, 0.4);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    img {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 3px solid #8257e5;
      padding: 3px;
      background-color: #121214;
      margin-bottom: 12px;
      object-fit: cover;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: 24px;
    }
    .badge {
      display: inline-block;
      background-color: rgba(130, 87, 229, 0.2);
      color: #a883ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 14px;
    }
    .cartao.claro .badge {
      background-color: #ede4ff;
      color: #6833e4;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      opacity: 0.85;
      margin-bottom: 24px;
    }
    .botao-empresa {
      display: block;
      width: 100%;
      background: linear-gradient(90deg, #00b37e, #00875f);
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      box-sizing: border-box;
      box-shadow: 0 6px 18px rgba(0, 179, 126, 0.35);
    }
  </style>
</head>
<body>

  <div class="cartao" id="meuCartao">
    <!-- Botão de duas luas (clara e escura) no canto superior direito -->
    <button class="botao-lua" onclick="mudarTema()" title="Alternar tema">🌗</button>

    <img src="logo.png" alt="Logo NexByel">
    <h1>Byel Santos</h1>
    <span class="badge">FUNDADOR • NEXBYEL</span>
    <p>Desenvolvendo soluções digitais, sites modernos e sistemas interativos 🚀</p>

    <a href="nexbyel.html" class="botao-empresa">🏢 Acessar Site NexByel</a>
  </div>

  <script>
    function mudarTema() {
      let cartao = document.getElementById("meuCartao");
      cartao.classList.toggle("claro");
    }
  </script>

</body>
</html>
