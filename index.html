<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site</title>
  <style>
    body {
      background-color: #8257e5;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .cartao {
      background-color: #202024;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 350px;
      width: 100%;
    }
    img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #8257e5;
      margin-bottom: 10px;
      background-color: #ffffff;
    }
    .link-botao {
      display: block;
      background-color: #8257e5;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="cartao">
    <img src="https://dicebear.com" alt="Minha foto">
    <h1>Byel Santos</h1>
    <p>Tenho 13 anos e sou Desenvolvedor Web em treinamento 🚀</p>

    <a href="https://youtube.com" target="_blank" class="link-botao">Meu Canal Favorito</a>
    <a href="https://github.com" target="_blank" class="link-botao">Meu GitHub</a>
  </div>

</body>
</html>
